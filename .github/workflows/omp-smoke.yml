name: omp smoke

# The drift check against the latest oh-my-pi release (issue #3): omp ignores
# overlay keys it no longer knows, so the generated overlay can stop applying
# with no error, and its --json schemas carry no stability guarantee. Weekly,
# TestOmpSmoke (ompsmoke_test.go) launches the newest upstream binary with this
# repo's real generator, decoders and role tables and asserts what omp reads
# back. A failure opens one `omp-drift` issue naming the omp version and the
# failing checks, or comments on the one already open.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Download the latest omp release
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/omp"
          mkdir -p "$dir"
          # Same asset nix/omp.nix pins; no --tag means the release GitHub marks latest.
          gh release download --repo can1357/oh-my-pi --pattern omp-linux-x64 --dir "$dir"
          chmod +x "$dir/omp-linux-x64"
          version=$("$dir/omp-linux-x64" --version)
          echo "omp: $version"
          echo "CODE_OMP=$dir/omp-linux-x64" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the effective config, the --json schemas and the role inventory
        id: smoke
        env:
          CODE_OMP_SMOKE: "1"
        run: |
          set -o pipefail
          go test -run 'TestOmpSmoke$' -v ./ 2>&1 | tee smoke.log
      - name: Open or update the omp-drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMP_VERSION: ${{ steps.download.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          body="$RUNNER_TEMP/body.md"
          if [ "$SMOKE_OUTCOME" = "failure" ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown, not a shell expansion
            failing=$(grep -E '^\s*--- FAIL: TestOmpSmoke/' smoke.log | sed -E 's/^\s*--- FAIL: (\S+).*/- `\1`/' || true)
            [ -n "$failing" ] || failing="- (the test binary failed before any check reported; see the log)"
            {
              echo "The weekly smoke against **${OMP_VERSION:-omp (version unknown)}** failed ([run]($RUN_URL))."
              echo
              echo "Failing checks:"
              echo "$failing"
              echo
              echo "<details><summary>go test output (tail)</summary>"
              echo
              echo '```'
              tail -n 200 smoke.log
              echo '```'
              echo "</details>"
            } > "$body"
          else
            {
              echo "The weekly smoke could not run against **${OMP_VERSION:-the latest omp}**: the job failed before the checks ([run]($RUN_URL))."
              echo "Most likely the release download or its asset name (\`omp-linux-x64\`) changed."
            } > "$body"
          fi
          gh label create omp-drift --color B60205 --force \
            --description "the weekly smoke against the latest omp release failed"
          existing=$(gh issue list --label omp-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --label omp-drift \
              --title "omp drift: ${OMP_VERSION:-latest omp} fails the weekly smoke" \
              --body-file "$body"
          fi
