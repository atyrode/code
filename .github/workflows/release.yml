name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The manifold plugins ride the same tag: every bundle is packed from this tree, attached to
  # the release goreleaser just cut, and then handed to the integrated preview hub's receiver
  # (manifold's infra/previews/receiver.sh, verb `plugin`), which installs it from the release
  # URL. Production is never touched here: the operator installs from the same URL in the
  # plugin manager, by hand (docs/manifold-transition.md §9.4).
  plugins:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Read the manifold revision the plugins are written against
        id: manifold
        run: echo "rev=$(cat code/plugins/MANIFOLD_REV)" >> "$GITHUB_OUTPUT"
      # The kit is not published yet: the sibling checkout is the SDK (plugins/README.md).
      - uses: actions/checkout@v4
        with:
          repository: atyrode/manifold
          ref: ${{ steps.manifold.outputs.rev }}
          path: manifold
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install the kit's workspace
        run: bun install --frozen-lockfile
        working-directory: manifold
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: code/plugins
      - name: Pack
        run: bun run pack
        working-directory: code/plugins
      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" --repo "${{ github.repository }}" --clobber dist/*.manifold-plugin.json dist/SHA256SUMS
        working-directory: code/plugins
      - name: Install on the integrated preview
        # Inert unless the repository variable DEV_DEPLOY_HOST exists, like manifold's
        # deploy-dev.yml, whose key handling this mirrors: the receiver's key is forced-command,
        # so the words typed here travel as SSH_ORIGINAL_COMMAND and the host does the install
        # with the owner key it already holds. One call per bundle, parents before parts: ids
        # sorted so `atyrode.code` precedes `atyrode.code.generator`, which requires it.
        # These are isolated kit plugins; the Worker-authored panel requires explicit
        # hardened installation. The receiver must support manifold#364 before release.
        if: vars.DEV_DEPLOY_HOST != ''
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          ASSETS: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          umask 077
          key="$(mktemp)"
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key"
          # Bytewise sort so the prefix `atyrode.code` lands before `atyrode.code.generator`
          # regardless of the runner's locale; `ssh -n` so ssh cannot eat the remaining lines.
          while read -r sha file; do
            id="${file%.manifold-plugin.json}"
            printf '%s %s\n' "$id" "$sha"
          done < dist/SHA256SUMS | LC_ALL=C sort -k1,1 | while read -r id sha; do
            echo "installing $id ($sha) on the preview"
            ssh -n -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$key" \
              "${{ vars.DEV_DEPLOY_USER }}@${{ vars.DEV_DEPLOY_HOST }}" \
              "plugin $ASSETS/$id.manifold-plugin.json $sha --hardened"
          done
          rm -f "$key"
        working-directory: code/plugins
