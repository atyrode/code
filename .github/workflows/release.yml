name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: code
          persist-credentials: false
      - name: Read the pinned Manifold revision
        id: manifold
        run: |
          rev="$(tr -d '[:space:]' < code/plugins/MANIFOLD_REV)"
          [ -n "$rev" ] || { echo "MANIFOLD_REV is empty"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: atyrode/manifold
          ref: ${{ steps.manifold.outputs.rev }}
          path: manifold
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Check, test, pack and verify the native plugin family
        working-directory: code
        run: bash scripts/gate.sh
      - name: Create the tagged release with verified native bundles
        working-directory: code/plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes \
            dist/*.manifold-plugin.json dist/SHA256SUMS
