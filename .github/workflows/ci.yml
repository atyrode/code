name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: Provision the containment backend
        # The escape scenarios in sandbox_linux_test.go are the only evidence
        # that the boundary Babel refuses runs without actually holds, and they
        # need bubblewrap plus a systemd user session. ubuntu-latest ships
        # neither: without this step every scenario skips and the job stays
        # green, which retires the gate for every later change. The tests fail
        # rather than skip when CI is set, so a regression here is loud.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

          # Ubuntu 23.10 onward confines unprivileged user namespaces with
          # AppArmor, and bwrap is not a profiled binary here, so creating the
          # network namespace succeeds but bringing up its loopback fails with
          # "Failed RTM_NEWADDR: Operation not permitted". The sandbox is built
          # on unprivileged userns by design (decision 57), so this restriction
          # has to be lifted for the runner rather than worked around. It is a
          # property of the CI host only; the operator's own machine already
          # allows it, and a machine that does not is expected to refuse the
          # backend rather than to weaken it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done

          # Assert the composition, not each half. The first version of this
          # step checked bwrap --version and an empty scope separately; both
          # passed while the thing the tests actually need — bwrap unsharing
          # the network inside a scope — failed, so a provisioning problem
          # surfaced as ten test failures instead of a named step failure.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemd-run --user --scope --quiet -p MemoryMax=256M -p TasksMax=32 -- \
            bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
              --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev \
              --size 1048576 --tmpfs /tmp -- /usr/bin/test -d /tmp
          echo "bubblewrap unshares the network inside a transient user scope"
      - name: test
        run: go test ./...
