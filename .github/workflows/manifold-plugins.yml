name: manifold plugins

on:
  push:
    branches: [main]
    paths: ["plugins/**", ".github/workflows/manifold-plugins.yml"]
  pull_request:
    paths: ["plugins/**", ".github/workflows/manifold-plugins.yml"]

jobs:
  plugins:
    # Manifold's reusable plugins workflow: checks this repo out beside atyrode/manifold at the
    # rev in plugins/MANIFOLD_REV (the sibling checkout is the SDK, plugins/README.md), then in
    # plugins/ runs check, test, pack and verify - the last against a real spawned server - and
    # uploads dist/. The ref below and plugins/MANIFOLD_REV are bumped together: the workflow
    # and the kit it drives come from the same manifold commit.
    uses: atyrode/manifold/.github/workflows/plugins.yml@d8dc6c93ad6a9d467b5546aec88af3b9c42ceb87
    with:
      plugins-dir: plugins
