version: 2

project_name: code

builds:
  - id: code
    binary: code
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: code-machine
    main: ./cmd/code-machine
    binary: code-machine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: code
    ids: [code]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
  - id: code-machine
    ids: [code-machine]
    formats: [tar.gz]
    name_template: "code-machine-{{ .Os }}-{{ .Arch }}"
    # Only the governed worker, never the installed Code CLI or a launcher.
    # A non-matching glob disables GoReleaser's default README/LICENSE additions.
    files: ["no-code-machine-extra-files-*"]
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
